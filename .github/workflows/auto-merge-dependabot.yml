name: Auto-merge Dependabot PRs

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Resolve associated PR
        id: pr
        uses: actions/github-script@v9
        with:
          # Emit plain string outputs (never a JSON object) so the next step's
          # `if:` can guard on `found` without dereferencing a possibly-null
          # result — returning null here would make `fromJSON(...).user` throw.
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.payload.workflow_run.head_sha,
            });

            if (prs.length === 0) {
              core.info('No PR associated with this commit — nothing to merge.');
              core.setOutput('found', 'false');
              return;
            }

            const pr = prs[0];
            core.info(`Found PR #${pr.number} by ${pr.user.login}`);
            core.setOutput('found', 'true');
            core.setOutput('number', String(pr.number));
            core.setOutput('user', pr.user.login);

      - name: Auto-merge Dependabot PR
        if: steps.pr.outputs.found == 'true' && steps.pr.outputs.user == 'dependabot[bot]'
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = Number('${{ steps.pr.outputs.number }}');

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.info(`PR #${prNumber} mergeable_state: ${pr.mergeable_state}`);

            if (pr.mergeable_state === 'clean') {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'squash',
                commit_title: pr.title,
                commit_message: `${pr.title}\n\n${pr.body || ''}`,
              });
              core.info(`Merged PR #${prNumber}.`);
            } else {
              core.info(`PR #${prNumber} not ready for merge (state: ${pr.mergeable_state}).`);
            }
