name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Force bash on every runner (including Windows, via Git Bash) so the shell
# steps below behave identically across the OS matrix.
defaults:
  run:
    shell: bash

jobs:
  check:
    name: check (node ${{ matrix.node }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20.19", "22", "24"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Assert bundle size (<= 500 KB gzipped)
        run: |
          size=$(gzip -c dist/cli.mjs | wc -c | tr -d ' ')
          echo "dist/cli.mjs gzipped: ${size} bytes"
          if [ "$size" -gt 512000 ]; then
            echo "::error::Bundle exceeds 500 KB gzipped (${size} bytes)"
            exit 1
          fi

  # The docs site is its own project. It depends on @silverassist/docsite, which lives in GitHub
  # Packages, so installing it needs the NPM_GITHUB_TOKEN secret. A pull request from a fork gets
  # no secrets, so the job is skipped there instead of failing.
  docs-site:
    name: docs site builds
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        env:
          NPM_GITHUB_TOKEN: ${{ secrets.NPM_GITHUB_TOKEN }}
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Publish check
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:publish
