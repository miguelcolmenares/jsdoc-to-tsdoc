name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: check (node ${{ matrix.node }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20.11", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Assert bundle size (<= 500 KB gzipped)
        run: |
          size=$(gzip -c dist/cli.mjs | wc -c | tr -d ' ')
          echo "dist/cli.mjs gzipped: ${size} bytes"
          if [ "$size" -gt 512000 ]; then
            echo "::error::Bundle exceeds 500 KB gzipped (${size} bytes)"
            exit 1
          fi
