name: Docs

on:
  push:
    branches: [main]
    paths:
      [
        "site/**",
        "docs/**",
        "examples/**",
        "README.md",
        "CHANGELOG.md",
        ".github/workflows/docs.yml",
      ]
  pull_request:
    paths:
      [
        "site/**",
        "docs/**",
        "examples/**",
        "README.md",
        "CHANGELOG.md",
        ".github/workflows/docs.yml",
      ]
  # A release changes the changelog and the version the site shows, so the site is rebuilt for it.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The picture a shared link shows (site.image). It is drawn in the job, so no image is committed.
      - uses: miguelcolmenares/social-card-action@8927027164b0022e3ba12c0736ce575d547fe4ce # v0.1.0
        with:
          path: site/public/social.png
          name: "jsdoc-to-tsdoc"
          description: "CLI tool to migrate JSDoc comments to the TSDoc standard in TypeScript projects."
          host: "miguelcolmenares.com/jsdoc-to-tsdoc"
      # Installs the site, builds it, checks it, and uploads the Pages artifact.
      - uses: miguelcolmenares/docs-sitekit@v0.2.4
        with:
          version: 0.2.4

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
