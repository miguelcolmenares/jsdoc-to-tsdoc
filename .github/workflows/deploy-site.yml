name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docsite.config.json"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      # The docsite package is in GitHub Packages, so this needs the NPM_GITHUB_TOKEN secret.
      - name: Install site dependencies
        working-directory: site
        env:
          NPM_GITHUB_TOKEN: ${{ secrets.NPM_GITHUB_TOKEN }}
        run: npm ci

      - name: Build site
        working-directory: site
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Publish check
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:publish

      - name: Add SPA fallback and disable Jekyll
        working-directory: site/dist
        run: |
          cp index.html 404.html
          touch .nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
